<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200">
  <defs>
    <clipPath id="clipR"><rect width="800" height="200" rx="16"/></clipPath>
    <linearGradient id="skyDusk" x1="0" y1="0" x2="0" y2="150" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0a0a12"/>
      <stop offset="55%" stop-color="#171528"/>
      <stop offset="85%" stop-color="#3a2536"/>
      <stop offset="100%" stop-color="#6e3a34"/>
